# OPA Gatekeeper — block :latest image tags in production
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8snolatestimageTag
spec:
  crd:
    spec:
      names:
        kind: K8sNoLatestImageTag
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8snolatestImagetag

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          endswith(container.image, ":latest")
          msg := sprintf("Container %v uses :latest tag — pin to a specific version", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not contains(container.image, ":")
          msg := sprintf("Container %v has no image tag — pin to a specific version", [container.name])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sNoLatestImageTag
metadata:
  name: no-latest-image-tag
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaces: ["mrnwaiwu-apps"]
