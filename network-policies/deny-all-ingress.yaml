# CIS 5.3.2 — Default deny all ingress traffic
# Apply this first, then layer allow rules on top.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mrnwaiwu-apps
spec:
  podSelector: {}       # applies to ALL pods in namespace
  policyTypes:
    - Ingress
  # No ingress rules = deny all inbound traffic
