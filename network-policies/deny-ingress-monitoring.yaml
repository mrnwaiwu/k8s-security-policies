apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress-monitoring
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: k8s-security-policies
    policy-type: network
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress only from within the monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    # Allow ingress from kube-system (e.g. metrics-server, coredns)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Allow ingress from the ingress-nginx namespace for external access to Grafana/Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000  # Grafana
        - protocol: TCP
          port: 9090  # Prometheus
