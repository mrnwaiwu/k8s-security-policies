apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-egress-metadata-api
  namespace: default
  labels:
    app.kubernetes.io/managed-by: k8s-security-policies
  annotations:
    security.policy/description: >
      Blocks pod egress to the EC2 instance metadata API (169.254.169.254).
      Prevents pods from retrieving IAM credentials via the metadata endpoint,
      mitigating SSRF-to-credential-theft attacks.
    security.policy/cis-benchmark: "CIS Kubernetes Benchmark v1.8 - 5.3.2"
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow all egress EXCEPT to the link-local metadata IP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
