apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
    services: "10"
    services.loadbalancers: "2"
    services.nodeports: "0"
    persistentvolumeclaims: "5"
    requests.storage: "50Gi"
    count/deployments.apps: "10"
    count/replicasets.apps: "20"
    count/secrets: "30"
    count/configmaps: "20"
