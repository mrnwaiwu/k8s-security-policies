---
# Least-privilege Role for CI/CD pipeline service accounts.
# Grants only the verbs needed to deploy and roll out workloads in the
# "apps" namespace. No access to secrets, RBAC, or cluster-scoped resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: apps
  labels:
    app.kubernetes.io/part-of: k8s-security-policies
    rbac.example.com/tier: ci
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding
  namespace: apps
  labels:
    app.kubernetes.io/part-of: k8s-security-policies
    rbac.example.com/tier: ci
subjects:
  - kind: ServiceAccount
    name: ci-pipeline
    namespace: apps
roleRef:
  kind: Role
  name: ci-deployer
  apiGroup: rbac.authorization.k8s.io
