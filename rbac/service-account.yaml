apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: mrnwaiwu-apps
  annotations:
    # Limit this SA to only the AWS IAM role it needs (IRSA for EKS)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/app-role
automountServiceAccountToken: false   # CIS 5.1.6 — disable auto-mount
---
# Minimal role for the service account — principle of least privilege
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-sa-role
  namespace: mrnwaiwu-apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-sa-binding
  namespace: mrnwaiwu-apps
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: mrnwaiwu-apps
roleRef:
  kind: Role
  name: app-sa-role
  apiGroup: rbac.authorization.k8s.io
