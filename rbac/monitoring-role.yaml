apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-role
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: k8s-security-policies
    security.io/reviewed: "true"
rules:
  # Allow reading pods and their logs for monitoring purposes
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  # Allow reading services and endpoints
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Allow reading ConfigMaps (e.g. for scrape configs)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading nodes metrics
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  # Allow reading resource quotas and limit ranges
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Allow reading deployments and replicasets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-role-binding
  namespace: monitoring
  labels:
    app.kubernetes.io/managed-by: k8s-security-policies
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  kind: Role
  name: monitoring-role
  apiGroup: rbac.authorization.k8s.io
