# ClusterRole granting read-only access to resources needed by monitoring agents
# (e.g. Prometheus, Datadog, Grafana Agent) without elevated privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-reader
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Read-only access to pods, nodes, services, and metrics for monitoring agents"
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - pods
      - pods/log
      - services
      - endpoints
      - namespaces
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  - nonResourceURLs:
      - /metrics
      - /healthz
      - /readyz
    verbs: ["get"]
---
# ClusterRoleBinding — bind the monitoring-reader role to the monitoring service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-reader-binding
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-reader
subjects:
  - kind: ServiceAccount
    name: monitoring-agent
    namespace: monitoring
