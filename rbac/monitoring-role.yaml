---
# monitoring-role.yaml
# Grants read-only access to resources needed by a monitoring agent
# (e.g. Prometheus node-exporter, metrics-server, or a custom scraper).
# Bind this Role with a RoleBinding in each namespace being monitored,
# or promote to a ClusterRole + ClusterRoleBinding for cluster-wide access.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-reader
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Read-only access to pods, nodes, services, and metrics for monitoring agents"
rules:
  # Pod and node inspection
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - pods
      - pods/log
      - endpoints
      - services
      - namespaces
    verbs: ["get", "list", "watch"]

  # Resource usage metrics (metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # Events for alerting context
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  # ReplicaSets, Deployments, StatefulSets for topology context
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Ingress for traffic monitoring
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-reader-binding
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-reader
subjects:
  - kind: ServiceAccount
    name: monitoring-agent
    namespace: monitoring
